<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g id="Taxi ICON">
    <!-- Background (matches Groups.svg size and radius) -->
    <rect width="60" height="60" rx="13.28" fill="url(#paint0_linear_147_30)"/>

    <!-- Taxi Body -->
    <rect x="12" y="26" width="36" height="14" rx="3" fill="#FECE00"/>
    <!-- Taxi Cabin -->
    <rect x="18" y="20" width="24" height="10" rx="3" fill="#FFD948"/>

    <!-- Roof Sign -->
    <rect x="24" y="16" width="12" height="4" rx="1" fill="#F26B34"/>

    <!-- Windows -->
    <rect x="20" y="22" width="9" height="6" rx="1.5" fill="#313131"/>
    <rect x="31" y="22" width="9" height="6" rx="1.5" fill="#313131"/>

    <!-- Front Grill / Bumper -->
    <rect x="14" y="30" width="4" height="3" rx="1" fill="#B2D135"/>
    <rect x="42" y="30" width="4" height="3" rx="1" fill="#B2D135"/>

    <!-- Headlights -->
    <circle cx="14" cy="34.5" r="1.6" fill="#FEF3B0"/>
    <circle cx="46" cy="34.5" r="1.6" fill="#FEF3B0"/>

    <!-- Wheels -->
    <circle cx="20" cy="42" r="4" fill="#141514"/>
    <circle cx="40" cy="42" r="4" fill="#141514"/>

    <!-- Wheel centers -->
    <circle cx="20" cy="42" r="2" fill="#B2D135"/>
    <circle cx="40" cy="42" r="2" fill="#B2D135"/>

    <!-- Subtle ground shadow for style consistency -->
    <ellipse cx="30" cy="46.5" rx="14" ry="2.5" fill="#000000" fill-opacity="0.25"/>
  </g>

  <defs>
    <!-- Same gradient as Groups.svg -->
    <linearGradient id="paint0_linear_147_30" x1="30" y1="0" x2="30" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#313131"/>
      <stop offset="1" stop-color="#141514"/>
    </linearGradient>
  </defs>
</svg>
